[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anushibinj/lofi-dac"
authors = ["Lofify contributors"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1

# DSP is far too slow at opt-level 0 for meaningful timing tests and debug listening.
[profile.dev.package.lofify-dsp]
opt-level = 3

[profile.dev.package.lofify-engine]
opt-level = 3
