[package]
name = "lofify-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.35.0"
egui_plot = "0.36.0"
lofify-dsp = { version = "0.1.0", path = "../lofify-dsp" }
lofify-engine = { version = "0.1.0", path = "../lofify-engine" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[lints]
workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
auto-launch = "0.6.0"
global-hotkey = "0.8.0"
single-instance = "0.3.3"
tray-icon = "0.25.1"

[dev-dependencies]
tempfile = "3.27.0"
