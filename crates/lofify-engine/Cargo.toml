[package]
name = "lofify-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
lofify-dsp = { version = "0.1.0", path = "../lofify-dsp" }
rtrb = "0.4.0"
rubato = "5.0.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

# cpal is only built where Lofify has a real backend. Linux is out of scope and would need ALSA headers.
[target.'cfg(target_os = "windows")'.dependencies]
# `realtime` promotes the WASAPI callback threads through MMCSS.
cpal = { version = "0.18.2", features = ["realtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
# Core Audio process tap (macOS 14.2+), used for system audio capture without a virtual driver.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3.1"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSProcessInfo", "NSUUID"] }
