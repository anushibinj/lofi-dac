name = "Classic Lofi"
description = "Warm, muffled and a little wobbly: the standard lofi hip hop sound."

[input]
trim_db = 0.0

[tape]
wow_cents = 8.0
wow_hz = 0.5
flutter_cents = 2.0
flutter_hz = 6.5
drift_cents = 1.5

[saturation]
drive = 1.5
makeup_db = 1.5

[crush]
bits = 12.0
sample_rate_hz = 20000.0
dither = true

[filters]
hpf_enabled = true
hpf_hz = 90.0
lpf_enabled = true
lpf_hz = 4500.0
lpf_q = 0.7
shelf_hz = 200.0
shelf_db = 2.0

[reverb]
room = 0.5
damping = 0.5
mix = 0.12

[vinyl]
pops_per_sec = 6.0
pop_db = -34.0
hiss_db = -50.0

[output]
gain_db = 0.0

[mix]
wet_dry = 1.0
