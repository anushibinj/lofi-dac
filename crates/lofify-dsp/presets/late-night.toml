name = "Late Night"
description = "Darker and roomier, with gentle tape drift and only a whisper of crackle."

[input]
trim_db = 0.0

[tape]
wow_cents = 5.0
wow_hz = 0.4
flutter_cents = 1.0
flutter_hz = 5.5
drift_cents = 1.0

[saturation]
drive = 1.2
makeup_db = 1.0

[crush]
bits = 14.0
sample_rate_hz = 24000.0
dither = true

[filters]
hpf_enabled = true
hpf_hz = 70.0
lpf_enabled = true
lpf_hz = 2800.0
lpf_q = 0.8
shelf_hz = 180.0
shelf_db = 3.0

[reverb]
room = 0.7
damping = 0.65
mix = 0.28

[vinyl]
pops_per_sec = 2.0
pop_db = -42.0
hiss_db = -56.0

[output]
gain_db = 0.0

[mix]
wet_dry = 1.0
